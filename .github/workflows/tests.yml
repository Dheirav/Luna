# Runs the whole test suite on every push and pull request.
#
# Everything here is deliberately emulator-free. `:core` is a plain JVM module and `:app`'s unit tests
# are too, so the entire suite finishes in seconds on a free runner — which is the only reason CI is
# worth having on a one-person project. Nothing in this file needs a device, an SDK image, or a secret.
#
# Why it exists: 126 tests existed with nothing running them. Every regression this repository has
# caught so far was caught by someone remembering to run gradle by hand, including two on 2026-08-12
# that were found only because a specific suspicion prompted a specific check.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # So it can be run against a branch by hand without pushing a dummy commit.
  workflow_dispatch:

# A second push to the same branch cancels the first. The suite is short, so a queue is never useful.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The Gradle project is a subdirectory; the repository root holds only docs and the fixture.
        working-directory: android

    steps:
      - uses: actions/checkout@v4

      # JDK 21 to match the version pinned locally in ~/.gradle/gradle.properties. A mismatch here
      # would produce failures that cannot be reproduced on the machine this is developed on.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Split from the Android module so a pure-engine failure is obvious in the job list without
      # opening a log. The engine is where the rules live and where a regression matters most.
      - name: "Engine tests: core"
        run: ./gradlew :core:test

      - name: "Unit tests: app"
        run: ./gradlew :app:testDebugUnitTest

      # `assembleDebug` compiles the Compose and RemoteViews code that no unit test touches. Widget
      # layouts in particular fail at *inflation* time on a device, so compiling them is the earliest
      # any problem can be seen — and `-PminifyDebug` runs R8 over the release ProGuard rules, which
      # is the only automated check that they still work.
      - name: Build debug APK with shrinking
        run: ./gradlew :app:assembleDebug -PminifyDebug

      # The authoritative INTERNET check, on the built artifact rather than on source.
      #
      # `copy-rules` greps the source tree, and that is not enough: `ACCESS_NETWORK_STATE` is in the
      # shipped APK and appears nowhere in this repository — WorkManager's manifest contributes it
      # during merge. The same route could contribute INTERNET, which is exactly the case the source
      # grep claims to cover and does not. Only the APK knows what actually shipped.
      - name: No INTERNET permission in the built APK
        run: |
          set -euo pipefail
          AAPT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)aapt2
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT" dump permissions "$APK" > /tmp/perms.txt
          echo "Permissions in the built APK:"
          grep "uses-permission" /tmp/perms.txt || true
          if grep -q "android.permission.INTERNET" /tmp/perms.txt; then
            echo "::error::INTERNET reached the merged manifest. See README and rule 5."
            exit 1
          fi

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            android/core/build/reports/tests/
            android/app/build/reports/tests/
          retention-days: 7

  # A grep pass, because these are rules about wording that no unit test can see. Both were enforced
  # by hand on 2026-08-12 and by nothing afterwards.
  copy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One idea, one word. Seven words for "a day the app worked out rather than one you lived" were
      # collapsed into `estimated`/`observed`, so a user learns the distinction once instead of six
      # times. These words are the ones that were retired; `backfill` names an internal process and is
      # still correct in comments, which is why only string literals are searched.
      - name: No retired vocabulary in user-facing strings
        run: |
          set -euo pipefail
          hits=$(grep -rnoE '"[^"]*\b(backfill|guesswork|guesses|guessed)\b[^"]*"' \
            android/app/src/main/kotlin --include='*.kt' || true)
          if [ -n "$hits" ]; then
            echo "Retired vocabulary in a user-facing string. Use estimated/observed:"
            echo "$hits"
            exit 1
          fi

      # No health data, ever. An ignore rule stops accidents; `git add -f` is not an accident, and
      # this is a public repository where a push is mirrored and indexed before anyone notices.
      # A seed file holding one person's real period dates was committed here once and had to be
      # purged from history — this is what makes that unrepeatable rather than merely discouraged.
      - name: No database or export data committed
        run: |
          set -euo pipefail
          bad=$(git ls-files | grep -iE '\.(db|db-wal|db-shm|db-journal|sqlite|sqlite3|cyc)$|^seed_|_periods\.json$|cycle-summary-.*\.txt$' || true)
          if [ -n "$bad" ]; then
            echo "Health data must never be committed. Offending files:"
            echo "$bad"
            exit 1
          fi
          # Belt and braces: a database renamed to something innocuous still has its header.
          for f in $(git ls-files); do
            if [ -f "$f" ] && head -c 16 "$f" 2>/dev/null | grep -q "SQLite format 3"; then
              echo "SQLite database committed under a non-obvious name: $f"
              exit 1
            fi
          done

      # The app has never had the INTERNET permission and the README promises it never will. That is
      # the single most load-bearing claim in the project, and a transitive dependency can add it to
      # the merged manifest without anyone writing a line.
      - name: No INTERNET permission
        run: |
          set -euo pipefail
          if grep -rn "android.permission.INTERNET" android/app/src android/core/src; then
            echo "The app must never request INTERNET. See README and rule 5."
            exit 1
          fi

  # The Room migration test, on an emulator, because it cannot run anywhere else.
  #
  # It was written to be run by hand against the phone. That turned out to be impossible: MIUI
  # refuses to install a *new* package over adb without "Install via USB", which needs a signed-in
  # Mi account, which needs a SIM the test phone does not have — `INSTALL_FAILED_USER_RESTRICTED`
  # with nobody touching the device. The same Mi-account gate blocks `adb shell input`. So the only
  # place this test can execute is a runner, which is better than the original plan: automatic
  # rather than remembered.
  #
  # Minutes rather than seconds, so it is kept off pull requests — the fast jobs above stay fast
  # and this guards what actually reaches main.
  migration-test:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # KVM has to be reachable or the emulator falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 31 because that is minSdk. Testing a migration on an API the app cannot be installed on
      # would prove nothing about the SQLite it actually ships against.
      - name: Room migration test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.dheirav.cycletracker.data.MigrationTest

      - name: Upload migration report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-report
          path: android/app/build/reports/androidTests/
          retention-days: 7
